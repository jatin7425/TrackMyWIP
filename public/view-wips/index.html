<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIP Tracker</title>

    <link rel="stylesheet" href="view-wips/style.css">
    <link rel="stylesheet" href="../style.css">

    <script src="../component/header.js" defer></script>
    <script src="../component/sidebar.js" defer></script>
    <script src="view-wips/wip-viewer.js" defer></script>
</head>

<body>

    <header id="header">
        <button id="sidebar-toggle">☰</button>
        <h1 id="app-title">WIP Tracker</h1>
    </header>

    <aside id="sidebar"></aside>

    <section id="main-content">

        <div id="controls-container">
            <div id="wip-filters">
                <div class="filter-group">
                    <label for="year-filter">Year:</label>
                    <select id="year-filter"></select>
                </div>
                <div class="filter-group">
                    <label for="month-filter">Month:</label>
                    <select id="month-filter"></select>
                </div>
            </div>

            <div id="export-controls">
                <button id="export-csv-btn">Export All to Excel (CSV)</button>
            </div>
        </div>
        <div id="wip-container" class="google-doc-style">
            <p class="loading">Loading WIPs...</p>
        </div>

    </section>

</body>

</html>
