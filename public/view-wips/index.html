<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WIP Tracker</title>

    <!-- point to your css -->
    <link rel="stylesheet" href="view-wips/style.css">

    <!-- keep site-wide css if you have it -->
    <link rel="stylesheet" href="../style.css">

    <!-- your header/sidebar (deferred) -->
    <script src="../component/header.js" defer></script>
    <script src="../component/sidebar.js" defer></script>

    <!-- page script -->
    <script src="view-wips/wip-viewer.js" defer></script>
</head>

<body>
    <header id="header" class="app-header">
        <button id="sidebar-toggle" class="hamburger">☰</button>
        <h1 id="app-title" class="app-title">WIP Tracker</h1>
        <div class="header-spacer"></div>
    </header>

    <aside id="sidebar"></aside>

    <main id="main-content">
        <section id="controls-container" class="controls">
            <div class="filters">
                <div class="filter-group">
                    <label for="year-filter">Year</label>
                    <select id="year-filter" aria-label="Year filter"></select>
                </div>

                <div class="filter-group">
                    <label for="month-filter">Month</label>
                    <select id="month-filter" aria-label="Month filter"></select>
                </div>

                <div class="filter-group search-group">
                    <label for="filter-input" class="sr-only">Search</label>
                    <input id="filter-input" placeholder="Search WIPs (Ctrl+F)" />
                </div>
            </div>

            <div class="controls-actions">
                <button id="export-csv-btn" class="primary-btn">Export All to Excel (CSV)</button>
            </div>
        </section>

        <section id="wip-container" class="wip-list-container">
            <p class="loading">Loading WIPs...</p>
        </section>
    </main>
</body>

</html>
